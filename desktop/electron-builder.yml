# Empaquetado de escritorio. Se ejecuta desde la raíz del repositorio:
#   npx electron-builder --config desktop/electron-builder.yml --win   (o --mac / --linux)
appId: com.facelessstudio.app   # se mantiene para que la nueva versión actualice la ya instalada
productName: Clippers Pro
copyright: Clippers Pro
extraMetadata:
  main: desktop/main.js
directories:
  output: dist-desktop
  buildResources: desktop/build
asar: false            # ffmpeg, yt-dlp, los modelos y la base de datos WASM se leen como archivos normales
files:
  - package.json
  - server/**
  - public/**
  - fonts/**
  - models/**
  - desktop/main.js
  - "!**/*.map"
  - "!**/{test,tests,__tests__,docs,example,examples}/**"
extraResources:
  - from: desktop/bin
    to: bin
    filter: ["**/*"]
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: desktop/build/icon.png
  artifactName: ClippersPro-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Clippers Pro
mac:
  target: [{ target: dmg }]
  category: public.app-category.video
  icon: desktop/build/icon.png
  identity: "-"        # firma local (ad-hoc), sin certificado de Apple: ver instrucciones para abrirla la primera vez
  artifactName: ClippersPro-${version}-mac-${arch}.${ext}
dmg:
  title: Clippers Pro
linux:
  target: [AppImage]
  category: Video
  icon: desktop/build/icon.png
  artifactName: ClippersPro-${version}-linux.${ext}
