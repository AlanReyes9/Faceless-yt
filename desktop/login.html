<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Clippers Pro · Iniciar sesión</title>
<style>
  :root { --bg:#0e0f13; --panel:#16181d; --line:#2a2e37; --text:#e9eaee; --muted:#9399a6; --green:#22c55e; --red:#ef5350; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system, Segoe UI, Inter, system-ui, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; -webkit-app-region: drag; }
  .card { width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; -webkit-app-region: no-drag; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:6px; }
  .logo { width:34px; height:34px; border-radius:8px; background:var(--green); display:flex; align-items:center; justify-content:center; }
  p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:14px; outline:none; }
  input:focus { border-color: var(--green); }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:9px; background:var(--green); color:#06190d; font-weight:700; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--red); font-size:13px; margin-top:12px; min-height:18px; white-space:pre-wrap; }
  .dev { color:var(--muted); font-size:11px; margin-top:14px; text-align:center; word-break:break-all; }
</style></head>
<body><form class="card" id="f">
  <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z" fill="#121317"/></svg></div>Clippers Pro</div>
  <p>Inicia sesión con la cuenta que te dio el administrador.</p>
  <label>Usuario</label><input id="u" autocomplete="username" autofocus required>
  <label>Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Entrar</button>
  <div class="err" id="e"></div>
  <div class="dev" id="d"></div>
</form>
<script>
  const $ = id => document.getElementById(id);
  window.clippers.info().then(i => { if (i.message) $('e').textContent = i.message; if (i.username) $('u').value = i.username; $('d').textContent = 'ID de este equipo: ' + i.deviceShort; });
  $('f').onsubmit = async e => {
    e.preventDefault(); $('b').disabled = true; $('b').textContent = 'Comprobando…'; $('e').textContent = '';
    const r = await window.clippers.login($('u').value.trim(), $('p').value);
    if (!r.ok) { $('e').textContent = r.error; $('b').disabled = false; $('b').textContent = 'Entrar'; }
  };
</script></body></html>
