# Compila la app de escritorio: instalador .exe (Windows) y .dmg (macOS Apple Silicon e Intel).
# Se ejecuta al publicar una etiqueta v* (crea una Release con los instaladores) o a mano desde "Actions".
name: App de escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar como Release (p. ej. 0.2.0). Vacío = solo compilar.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            ytdlp: yt-dlp.exe
            ytdlp_out: yt-dlp.exe
            wflags: -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          - os: macos-latest      # Apple Silicon (M1/M2/M3/M4)
            target: --mac --arm64
            ytdlp: yt-dlp_macos
            ytdlp_out: yt-dlp
            wflags: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - os: macos-15-intel    # Intel
            target: --mac --x64
            ytdlp: yt-dlp_macos
            ytdlp_out: yt-dlp
            wflags: -DGGML_METAL=OFF -DGGML_BLAS=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm install -D --no-audit --no-fund electron@37.10.3 electron-builder@26.0.12
          node node_modules/ffmpeg-static/install.js
          node -e "const f=require('ffmpeg-static');require('fs').accessSync(f);console.log('ffmpeg:',f)"

      - name: Clave pública de licencias
        shell: bash
        run: grep -q "BEGIN PUBLIC KEY" desktop/license-pubkey.pem || (echo "Falta desktop/license-pubkey.pem (GET /api/license/pubkey del servidor central)" && exit 1)

      - name: Prueba de render con el ffmpeg incluido
        shell: bash
        run: node --no-warnings desktop/smoke.mjs 2>&1 | grep -v onnxruntime

      - name: yt-dlp incluido (YouTube, Twitch, Kick)
        shell: bash
        run: |
          mkdir -p desktop/bin
          curl -fsSL -o "desktop/bin/${{ matrix.ytdlp_out }}" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          chmod +x "desktop/bin/${{ matrix.ytdlp_out }}"
          ls -la desktop/bin

      - name: Transcripción local (whisper.cpp)
        shell: bash
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF ${{ matrix.wflags }}
          cmake --build wcpp/build --config Release -j 4 --target whisper-cli
          BIN=$(find wcpp/build/bin -name 'whisper-cli*' -type f | head -1)
          cp "$BIN" desktop/bin/
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then # versión con la tarjeta gráfica (Metal, experimental)
            cmake -S wcpp -B wcpp/build-gpu -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
              -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            cmake --build wcpp/build-gpu --config Release -j 4 --target whisper-cli
            cp wcpp/build-gpu/bin/whisper-cli desktop/bin/whisper-cli-gpu
          fi
          ls -la desktop/bin

      - name: Prueba de transcripción local
        shell: bash
        env:
          WHISPER_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          export WHISPER_CLI="$PWD/desktop/bin/$(ls desktop/bin | grep -E "^whisper-cli(\.exe)?$")"
          node --no-warnings desktop/smoke-whisper.mjs wcpp/samples/jfk.wav

      - name: IA local de texto (llama.cpp) e imágenes (stable-diffusion.cpp)
        shell: bash
        run: |
          git clone -q --depth 1 --branch b6999 https://github.com/ggml-org/llama.cpp lcpp
          cmake -S lcpp -B lcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF ${{ matrix.wflags }}
          cmake --build lcpp/build --config Release -j 4 --target llama-server
          cp "$(find lcpp/build/bin -name 'llama-server*' -type f | head -1)" desktop/bin/
          git clone -q --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          SDF="-DSD_BUILD_SHARED_LIBS=OFF"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then SDF="$SDF -DSD_METAL=ON"; fi
          cmake -S sdcpp -B sdcpp/build -DCMAKE_BUILD_TYPE=Release $SDF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF ${{ matrix.wflags }}
          cmake --build sdcpp/build --config Release -j 4
          SDB=$(find sdcpp/build/bin -type f \( -name 'sd' -o -name 'sd.exe' -o -name 'sd-cli' -o -name 'sd-cli.exe' \) | head -1)
          cp "$SDB" desktop/bin/
          # Mac Intel: segunda versión con la tarjeta gráfica (Metal, experimental en AMD). La app la prueba y,
          # si falla, usa la del procesador.
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            GF="-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
            cmake -S lcpp -B lcpp/build-gpu -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF $GF
            cmake --build lcpp/build-gpu --config Release -j 4 --target llama-server
            cp lcpp/build-gpu/bin/llama-server desktop/bin/llama-server-gpu
            cmake -S sdcpp -B sdcpp/build-gpu -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=OFF -DSD_METAL=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF $GF
            cmake --build sdcpp/build-gpu --config Release -j 4
            cp "$(find sdcpp/build-gpu/bin -type f \( -name 'sd' -o -name 'sd-cli' \) | head -1)" desktop/bin/sd-gpu
            desktop/bin/llama-server-gpu --version 2>&1 | head -3 || true
          fi
          ls -la desktop/bin

      - name: Prueba de la IA local
        shell: bash
        env:
          WHISPER_MODELS_DIR: ${{ runner.temp }}/models
        run: |
          export LLAMA_SERVER="$PWD/desktop/bin/$(ls desktop/bin | grep -E "^llama-server(\.exe)?$")"
          node --no-warnings desktop/smoke-llm.mjs
          SDX="$PWD/desktop/bin/$(ls desktop/bin | grep -E '^sd(-cli)?(\.exe)?$' | head -1)"
          "$SDX" --help > sdhelp.txt 2>&1 || true
          head -8 sdhelp.txt
          grep -qi "usage\|--prompt" sdhelp.txt

      - name: Versión
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: |
          V="${{ inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          npm pkg set version="$V"

      - name: Compilar
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config desktop/electron-builder.yml ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: faceless-studio-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
          if-no-files-found: error

      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: Clippers Pro ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
